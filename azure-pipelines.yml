# ============================================================
# AZURE DEVOPS PIPELINE
# PostgreSQL + pgAdmin on AKS
# ============================================================

name: postgres-pgadmin

# ============================================================
# TRIGGER
# ============================================================

trigger:
- main

# ============================================================
# AGENT POOL
# ============================================================

pool:
  name: Default

# ============================================================
# VARIABLES
# ============================================================

variables:

  azureServiceConnection: 'axion_service_connection'

  resourceGroup: 'axion-rg1'

  aksCluster: 'axion-aks1'

  # Repository structure:
  # Axion_AI_Ops/k8s/
  k8sDirectory: '$(Build.SourcesDirectory)/Axion_AI_Ops'


# ============================================================
# STAGES
# ============================================================

stages:


# ============================================================
# STAGE 1
# CONNECT TO AKS
# ============================================================

- stage: AKS_Connection

  displayName: '1. Connect to AKS'

  jobs:

  - job: ConnectToAKS

    displayName: 'Connect and Verify AKS'

    steps:

    # --------------------------------------------------------
    # Checkout Repository
    # --------------------------------------------------------

    - checkout: self


    # --------------------------------------------------------
    # Azure Login + AKS Connection
    # --------------------------------------------------------

    - task: AzureCLI@2

      displayName: 'Login and Connect to AKS'

      inputs:

        connectionType: 'Azure Resource Manager'

        azureSubscription: '$(azureServiceConnection)'

        scriptType: 'bash'

        scriptLocation: 'inlineScript'

        inlineScript: |

          set -e

          echo ""
          echo "=========================================="
          echo "AZURE ACCOUNT"
          echo "=========================================="

          az account show


          echo ""
          echo "=========================================="
          echo "GETTING AKS CREDENTIALS"
          echo "=========================================="

          az aks get-credentials \
            --resource-group "$(resourceGroup)" \
            --name "$(aksCluster)" \
            --overwrite-existing


          echo ""
          echo "=========================================="
          echo "CURRENT KUBERNETES CONTEXT"
          echo "=========================================="

          kubectl config current-context


          echo ""
          echo "=========================================="
          echo "AKS NODES"
          echo "=========================================="

          kubectl get nodes -o wide


# ============================================================
# STAGE 2
# DEPLOY POSTGRESQL
# ============================================================

- stage: Deploy_PostgreSQL

  displayName: '2. Deploy PostgreSQL'

  dependsOn: AKS_Connection

  jobs:

  - job: PostgreSQL

    displayName: 'Deploy PostgreSQL'

    steps:

    # --------------------------------------------------------
    # Checkout Repository
    # --------------------------------------------------------

    - checkout: self


    # --------------------------------------------------------
    # Verify Kubernetes Directory
    # --------------------------------------------------------

    - bash: |

        set -e

        echo ""
        echo "=========================================="
        echo "BUILD SOURCES DIRECTORY"
        echo "=========================================="

        echo "$(Build.SourcesDirectory)"


        echo ""
        echo "=========================================="
        echo "KUBERNETES DIRECTORY"
        echo "=========================================="

        echo "$(k8sDirectory)"


        echo ""
        echo "=========================================="
        echo "REPOSITORY ROOT"
        echo "=========================================="

        ls -la "$(Build.SourcesDirectory)"


        echo ""
        echo "=========================================="
        echo "K8S DIRECTORY"
        echo "=========================================="

        test -d "$(k8sDirectory)"

        ls -la "$(k8sDirectory)"


        echo ""
        echo "=========================================="
        echo "CHECKING POSTGRESQL YAML FILES"
        echo "=========================================="

        test -f "$(k8sDirectory)/postgresssql.yml"

        test -f "$(k8sDirectory)/postgres-service.yaml"


        echo ""
        echo "PostgreSQL YAML files found successfully."

      displayName: 'Verify PostgreSQL YAML Files'


    # --------------------------------------------------------
    # Deploy PostgreSQL
    # --------------------------------------------------------

    - task: AzureCLI@2

      displayName: 'Deploy PostgreSQL to AKS'

      inputs:

        connectionType: 'Azure Resource Manager'

        azureSubscription: '$(azureServiceConnection)'

        scriptType: 'bash'

        scriptLocation: 'inlineScript'

        inlineScript: |

          set -e

          echo ""
          echo "=========================================="
          echo "GETTING AKS CREDENTIALS"
          echo "=========================================="

          az aks get-credentials \
            --resource-group "$(resourceGroup)" \
            --name "$(aksCluster)" \
            --overwrite-existing


          echo ""
          echo "=========================================="
          echo "CURRENT KUBERNETES CONTEXT"
          echo "=========================================="

          kubectl config current-context


          echo ""
          echo "=========================================="
          echo "CREATING DATABASE NAMESPACE"
          echo "=========================================="

          kubectl create namespace database \
            --dry-run=client \
            -o yaml | kubectl apply -f -


          echo ""
          echo "=========================================="
          echo "DATABASE NAMESPACE"
          echo "=========================================="

          kubectl get namespace database


          echo ""
          echo "=========================================="
          echo "DEPLOYING POSTGRESQL"
          echo "=========================================="

          kubectl apply \
            -n database \
            -f "$(k8sDirectory)/postgresssql.yml"


          echo ""
          echo "=========================================="
          echo "DEPLOYING POSTGRESQL SERVICE"
          echo "=========================================="

          kubectl apply \
            -n database \
            -f "$(k8sDirectory)/postgres-service.yaml"


          echo ""
          echo "=========================================="
          echo "POSTGRESQL DEPLOYMENT"
          echo "=========================================="

          kubectl get deployments \
            -n database


          echo ""
          echo "=========================================="
          echo "POSTGRESQL PODS"
          echo "=========================================="

          kubectl get pods \
            -n database \
            -o wide


          echo ""
          echo "=========================================="
          echo "POSTGRESQL SERVICE"
          echo "=========================================="

          kubectl get svc \
            -n database


          echo ""
          echo "=========================================="
          echo "DATABASE RESOURCES"
          echo "=========================================="

          kubectl get all \
            -n database


# ============================================================
# STAGE 3
# DEPLOY PGADMIN
# ============================================================

- stage: Deploy_pgAdmin

  displayName: '3. Deploy pgAdmin'

  dependsOn: Deploy_PostgreSQL

  jobs:

  - job: pgAdmin

    displayName: 'Deploy pgAdmin'

    steps:

    # --------------------------------------------------------
    # Checkout Repository
    # --------------------------------------------------------

    - checkout: self


    # --------------------------------------------------------
    # Verify pgAdmin YAML Files
    # --------------------------------------------------------

    - bash: |

        set -e

        echo ""
        echo "=========================================="
        echo "KUBERNETES DIRECTORY"
        echo "=========================================="

        echo "$(k8sDirectory)"


        echo ""
        echo "=========================================="
        echo "K8S FILES"
        echo "=========================================="

        test -d "$(k8sDirectory)"

        ls -la "$(k8sDirectory)"


        echo ""
        echo "=========================================="
        echo "CHECKING PGADMIN YAML FILES"
        echo "=========================================="

        test -f "$(k8sDirectory)/pgadmin-deployment.yml"

        test -f "$(k8sDirectory)/pgadmin-service.yaml"


        echo ""
        echo "pgAdmin YAML files found successfully."

      displayName: 'Verify pgAdmin YAML Files'


    # --------------------------------------------------------
    # Deploy pgAdmin
    # --------------------------------------------------------

    - task: AzureCLI@2

      displayName: 'Deploy pgAdmin to AKS'

      inputs:

        connectionType: 'Azure Resource Manager'

        azureSubscription: '$(azureServiceConnection)'

        scriptType: 'bash'

        scriptLocation: 'inlineScript'

        inlineScript: |

          set -e

          echo ""
          echo "=========================================="
          echo "GETTING AKS CREDENTIALS"
          echo "=========================================="

          az aks get-credentials \
            --resource-group "$(resourceGroup)" \
            --name "$(aksCluster)" \
            --overwrite-existing


          echo ""
          echo "=========================================="
          echo "CURRENT KUBERNETES CONTEXT"
          echo "=========================================="

          kubectl config current-context


          echo ""
          echo "=========================================="
          echo "CHECKING POSTGRESQL"
          echo "=========================================="

          kubectl get pods \
            -n database

          kubectl get svc \
            -n database


          echo ""
          echo "=========================================="
          echo "DEPLOYING PGADMIN"
          echo "=========================================="

          kubectl apply \
            -n database \
            -f "$(k8sDirectory)/pgadmin-deployment.yml"


          echo ""
          echo "=========================================="
          echo "DEPLOYING PGADMIN SERVICE"
          echo "=========================================="

          kubectl apply \
            -n database \
            -f "$(k8sDirectory)/pgadmin-service.yaml"


          echo ""
          echo "=========================================="
          echo "PGADMIN DEPLOYMENT"
          echo "=========================================="

          kubectl get deployments \
            -n database


          echo ""
          echo "=========================================="
          echo "PGADMIN PODS"
          echo "=========================================="

          kubectl get pods \
            -n database \
            -o wide


          echo ""
          echo "=========================================="
          echo "PGADMIN SERVICES"
          echo "=========================================="

          kubectl get svc \
            -n database


          echo ""
          echo "=========================================="
          echo "ALL DATABASE RESOURCES"
          echo "=========================================="

          kubectl get all \
            -n database


# ============================================================
# STAGE 4
# FINAL VERIFICATION
# ============================================================

- stage: Verify

  displayName: '4. Final Verification'

  dependsOn: Deploy_pgAdmin

  jobs:

  - job: FinalVerification

    displayName: 'Verify PostgreSQL and pgAdmin'

    steps:

    # --------------------------------------------------------
    # Checkout Repository
    # --------------------------------------------------------

    - checkout: self


    # --------------------------------------------------------
    # Final Verification
    # --------------------------------------------------------

    - task: AzureCLI@2

      displayName: 'Final AKS Verification'

      inputs:

        connectionType: 'Azure Resource Manager'

        azureSubscription: '$(azureServiceConnection)'

        scriptType: 'bash'

        scriptLocation: 'inlineScript'

        inlineScript: |

          set -e

          echo ""
          echo "##################################################"
          echo "# FINAL AKS VERIFICATION"
          echo "##################################################"


          # --------------------------------------------------
          # AKS Credentials
          # --------------------------------------------------

          echo ""
          echo "=========================================="
          echo "AKS CONTEXT"
          echo "=========================================="

          az aks get-credentials \
            --resource-group "$(resourceGroup)" \
            --name "$(aksCluster)" \
            --overwrite-existing

          kubectl config current-context


          # --------------------------------------------------
          # Namespace
          # --------------------------------------------------

          echo ""
          echo "=========================================="
          echo "DATABASE NAMESPACE"
          echo "=========================================="

          kubectl get namespace database


          # --------------------------------------------------
          # Deployments
          # --------------------------------------------------

          echo ""
          echo "=========================================="
          echo "DATABASE DEPLOYMENTS"
          echo "=========================================="

          kubectl get deployments \
            -n database


          # --------------------------------------------------
          # Pods
          # --------------------------------------------------

          echo ""
          echo "=========================================="
          echo "DATABASE PODS"
          echo "=========================================="

          kubectl get pods \
            -n database \
            -o wide


          # --------------------------------------------------
          # Services
          # --------------------------------------------------

          echo ""
          echo "=========================================="
          echo "DATABASE SERVICES"
          echo "=========================================="

          kubectl get svc \
            -n database


          # --------------------------------------------------
          # PVC
          # --------------------------------------------------

          echo ""
          echo "=========================================="
          echo "PERSISTENT VOLUME CLAIMS"
          echo "=========================================="

          kubectl get pvc \
            -n database


          # --------------------------------------------------
          # All Resources
          # --------------------------------------------------

          echo ""
          echo "=========================================="
          echo "ALL DATABASE RESOURCES"
          echo "=========================================="

          kubectl get all \
            -n database


          # --------------------------------------------------
          # PostgreSQL Service
          # --------------------------------------------------

          echo ""
          echo "=========================================="
          echo "POSTGRESQL SERVICE"
          echo "=========================================="

          kubectl get svc postgres \
            -n database \
            || true


          # --------------------------------------------------
          # pgAdmin Service
          # --------------------------------------------------

          echo ""
          echo "=========================================="
          echo "PGADMIN SERVICE"
          echo "=========================================="

          kubectl get svc pgadmin \
            -n database \
            || true


          # --------------------------------------------------
          # Pod Status
          # --------------------------------------------------

          echo ""
          echo "=========================================="
          echo "POD STATUS"
          echo "=========================================="

          kubectl get pods \
            -n database \
            -o custom-columns=NAME:.metadata.name,STATUS:.status.phase,READY:.status.containerStatuses[*].ready


          # --------------------------------------------------
          # Final Message
          # --------------------------------------------------

          echo ""
          echo "##################################################"
          echo "# POSTGRESQL + PGADMIN DEPLOYMENT COMPLETED"
          echo "##################################################"