name: postgres

trigger:
- main

pool:
  name: Default

variables:
  azureServiceConnection: 'axion_service_connection'
  resourceGroup: 'axion-rg1'
  aksCluster: 'axion-aks1'

stages:

# ============================================================
# STAGE 1 - AKS CONNECTION
# ============================================================

- stage: AKS_Connection
  displayName: 'Connect to AKS'

  jobs:
  - job: connect
    displayName: 'Get AKS Credentials'

    steps:
    - task: AzureCLI@2
      displayName: 'Connect to AKS'
      inputs:
        connectionType: 'Azure Resource Manager'
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'

        inlineScript: |
          set -e

          echo "======================================"
          echo "Azure Account"
          echo "======================================"

          az account show

          echo "======================================"
          echo "Getting AKS Credentials"
          echo "======================================"

          az aks get-credentials \
            --resource-group "$(resourceGroup)" \
            --name "$(aksCluster)" \
            --overwrite-existing

          echo "======================================"
          echo "Current Kubernetes Context"
          echo "======================================"

          kubectl config current-context

          echo "======================================"
          echo "AKS Nodes"
          echo "======================================"

          kubectl get nodes


# ============================================================
# STAGE 2 - DEPLOY POSTGRESQL
# ============================================================

- stage: Deploy_PostgreSQL
  displayName: 'Deploy PostgreSQL'

  dependsOn: AKS_Connection

  jobs:
  - job: PostgreSQL
    displayName: 'Deploy PostgreSQL'

    steps:

    - task: AzureCLI@2
      displayName: 'Deploy PostgreSQL'
      inputs:
        connectionType: 'Azure Resource Manager'
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'

        inlineScript: |
          set -e

          echo "======================================"
          echo "Getting AKS Credentials"
          echo "======================================"

          az aks get-credentials \
            --resource-group "$(resourceGroup)" \
            --name "$(aksCluster)" \
            --overwrite-existing

          echo "======================================"
          echo "Current Context"
          echo "======================================"

          kubectl config current-context

          echo "======================================"
          echo "Creating Database Namespace"
          echo "======================================"

          kubectl create namespace database \
            --dry-run=client \
            -o yaml | kubectl apply -f -

          echo "======================================"
          echo "Namespaces"
          echo "======================================"

          kubectl get namespaces

          echo "======================================"
          echo "Checking PostgreSQL YAML"
          echo "======================================"

          ls -la k8s/

          test -f k8s/postgresssql.yml
          test -f k8s/postgres-service.yaml

          echo "PostgreSQL YAML files found."

          echo "======================================"
          echo "Deploying PostgreSQL"
          echo "======================================"

          kubectl apply \
            -n database \
            -f k8s/postgresssql.yml

          echo "======================================"
          echo "Creating PostgreSQL Service"
          echo "======================================"

          kubectl apply \
            -n database \
            -f k8s/postgres-service.yaml

          echo "======================================"
          echo "PostgreSQL Resources"
          echo "======================================"

          kubectl get deployment -n database
          kubectl get pods -n database
          kubectl get svc -n database

          echo "======================================"
          echo "All Database Resources"
          echo "======================================"

          kubectl get all -n database


# ============================================================
# STAGE 3 - DEPLOY PGADMIN
# ============================================================

- stage: Deploy_pgAdmin
  displayName: 'Deploy pgAdmin'

  dependsOn: Deploy_PostgreSQL

  jobs:
  - job: pgAdmin
    displayName: 'Deploy pgAdmin'

    steps:

    - task: AzureCLI@2
      displayName: 'Deploy pgAdmin'
      inputs:
        connectionType: 'Azure Resource Manager'
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'

        inlineScript: |
          set -e

          echo "======================================"
          echo "Getting AKS Credentials"
          echo "======================================"

          az aks get-credentials \
            --resource-group "$(resourceGroup)" \
            --name "$(aksCluster)" \
            --overwrite-existing

          echo "======================================"
          echo "Current Context"
          echo "======================================"

          kubectl config current-context

          echo "======================================"
          echo "Checking PostgreSQL"
          echo "======================================"

          kubectl get all -n database

          echo "======================================"
          echo "Checking pgAdmin YAML"
          echo "======================================"

          test -f k8s/pgadmin-deployment.yml
          test -f k8s/pgadmin-service.yaml

          echo "pgAdmin YAML files found."

          echo "======================================"
          echo "Deploying pgAdmin"
          echo "======================================"

          kubectl apply \
            -n database \
            -f k8s/pgadmin-deployment.yml

          echo "======================================"
          echo "Creating pgAdmin Service"
          echo "======================================"

          kubectl apply \
            -n database \
            -f k8s/pgadmin-service.yaml

          echo "======================================"
          echo "pgAdmin Resources"
          echo "======================================"

          kubectl get deployment -n database
          kubectl get pods -n database
          kubectl get svc -n database

          echo "======================================"
          echo "All Database Resources"
          echo "======================================"

          kubectl get all -n database


# ============================================================
# STAGE 4 - VERIFY
# ============================================================

- stage: Verify
  displayName: 'Verify Deployment'

  dependsOn: Deploy_pgAdmin

  jobs:
  - job: Verify
    displayName: 'Verify PostgreSQL and pgAdmin'

    steps:

    - task: AzureCLI@2
      displayName: 'Verify Kubernetes Resources'
      inputs:
        connectionType: 'Azure Resource Manager'
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'

        inlineScript: |
          set -e

          echo "======================================"
          echo "Getting AKS Credentials"
          echo "======================================"

          az aks get-credentials \
            --resource-group "$(resourceGroup)" \
            --name "$(aksCluster)" \
            --overwrite-existing

          echo "======================================"
          echo "Current Context"
          echo "======================================"

          kubectl config current-context

          echo "======================================"
          echo "Namespaces"
          echo "======================================"

          kubectl get namespaces

          echo "======================================"
          echo "Deployments"
          echo "======================================"

          kubectl get deployments -n database

          echo "======================================"
          echo "Pods"
          echo "======================================"

          kubectl get pods -n database -o wide

          echo "======================================"
          echo "Services"
          echo "======================================"

          kubectl get svc -n database

          echo "======================================"
          echo "PVC"
          echo "======================================"

          kubectl get pvc -n database

          echo "======================================"
          echo "ALL DATABASE RESOURCES"
          echo "======================================"

          kubectl get all -n database

          echo "======================================"
          echo "ALL CLUSTER RESOURCES"
          echo "======================================"

          kubectl get pods -A
          kubectl get svc -A