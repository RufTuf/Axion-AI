name: postgres

trigger:
- main

pool:
  name: Default

variables:
  azureServiceConnection: 'axion_service_connection'
  resourceGroup: 'axion-rg1'
  aksCluster: 'axion-aks1'

stages:

# ============================================================
# STAGE 1 - AKS CONNECTION
# ============================================================

- stage: AKS_Connection
  displayName: 'Connect to AKS'

  jobs:
  - job: Connect
    displayName: 'Get AKS Credentials'

    steps:

    - checkout: self
      displayName: 'Checkout Repository'

    - task: AzureCLI@2
      displayName: 'Connect to AKS'
      inputs:
        connectionType: 'Azure Resource Manager'
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'

        inlineScript: |

          set -e

          echo "======================================"
          echo "Azure Account"
          echo "======================================"

          az account show

          echo "======================================"
          echo "Getting AKS Credentials"
          echo "======================================"

          az aks get-credentials \
            --resource-group "$(resourceGroup)" \
            --name "$(aksCluster)" \
            --overwrite-existing

          echo "======================================"
          echo "Current Kubernetes Context"
          echo "======================================"

          kubectl config current-context

          echo "======================================"
          echo "AKS Nodes"
          echo "======================================"

          kubectl get nodes


# ============================================================
# STAGE 2 - DEPLOY POSTGRESQL
# ============================================================

- stage: Deploy_PostgreSQL
  displayName: 'Deploy PostgreSQL'

  dependsOn: AKS_Connection

  jobs:
  - job: PostgreSQL
    displayName: 'Deploy PostgreSQL'

    steps:

    # --------------------------------------------------------
    # CHECKOUT REPOSITORY
    # --------------------------------------------------------

    - checkout: self
      displayName: 'Checkout Repository'

    # --------------------------------------------------------
    # CHECK KUBERNETES FILES
    # --------------------------------------------------------

    - bash: |

        set -e

        echo "======================================"
        echo "Working Directory"
        echo "======================================"

        pwd

        echo "======================================"
        echo "Build Sources Directory"
        echo "======================================"

        echo "$(Build.SourcesDirectory)"

        echo "======================================"
        echo "Repository Files"
        echo "======================================"

        ls -la "$(Build.SourcesDirectory)"

        echo "======================================"
        echo "K8s Directory"
        echo "======================================"

        if [ -d "$(Build.SourcesDirectory)/k8s" ]; then
          ls -la "$(Build.SourcesDirectory)/k8s"
        else
          echo "ERROR: k8s directory not found"
          exit 1
        fi

        echo "======================================"
        echo "Checking PostgreSQL YAML Files"
        echo "======================================"

        test -f "$(Build.SourcesDirectory)/k8s/postgresssql.yml"
        test -f "$(Build.SourcesDirectory)/k8s/postgres-service.yaml"

        echo "PostgreSQL YAML files found successfully."

      displayName: 'Verify Kubernetes YAML Files'


    # --------------------------------------------------------
    # DEPLOY POSTGRESQL
    # --------------------------------------------------------

    - task: AzureCLI@2
      displayName: 'Deploy PostgreSQL'
      inputs:
        connectionType: 'Azure Resource Manager'
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'

        inlineScript: |

          set -e

          echo "======================================"
          echo "Getting AKS Credentials"
          echo "======================================"

          az aks get-credentials \
            --resource-group "$(resourceGroup)" \
            --name "$(aksCluster)" \
            --overwrite-existing

          echo "======================================"
          echo "Current Kubernetes Context"
          echo "======================================"

          kubectl config current-context

          echo "======================================"
          echo "Creating Database Namespace"
          echo "======================================"

          kubectl create namespace database \
            --dry-run=client \
            -o yaml | kubectl apply -f -

          echo "======================================"
          echo "Database Namespace"
          echo "======================================"

          kubectl get namespace database

          echo "======================================"
          echo "Deploying PostgreSQL"
          echo "======================================"

          kubectl apply \
            -n database \
            -f "$(Build.SourcesDirectory)/k8s/postgresssql.yml"

          echo "======================================"
          echo "Creating PostgreSQL Service"
          echo "======================================"

          kubectl apply \
            -n database \
            -f "$(Build.SourcesDirectory)/k8s/postgres-service.yaml"

          echo "======================================"
          echo "PostgreSQL Deployments"
          echo "======================================"

          kubectl get deployments -n database

          echo "======================================"
          echo "PostgreSQL Pods"
          echo "======================================"

          kubectl get pods -n database -o wide

          echo "======================================"
          echo "PostgreSQL Services"
          echo "======================================"

          kubectl get svc -n database

          echo "======================================"
          echo "All Database Resources"
          echo "======================================"

          kubectl get all -n database


# ============================================================
# STAGE 3 - DEPLOY PGADMIN
# ============================================================

- stage: Deploy_pgAdmin
  displayName: 'Deploy pgAdmin'

  dependsOn: Deploy_PostgreSQL

  jobs:
  - job: pgAdmin
    displayName: 'Deploy pgAdmin'

    steps:

    # --------------------------------------------------------
    # CHECKOUT REPOSITORY
    # --------------------------------------------------------

    - checkout: self
      displayName: 'Checkout Repository'


    # --------------------------------------------------------
    # CHECK PGADMIN YAML FILES
    # --------------------------------------------------------

    - bash: |

        set -e

        echo "======================================"
        echo "Checking Repository"
        echo "======================================"

        pwd

        ls -la "$(Build.SourcesDirectory)"

        echo "======================================"
        echo "Checking K8s Directory"
        echo "======================================"

        ls -la "$(Build.SourcesDirectory)/k8s"

        echo "======================================"
        echo "Checking pgAdmin YAML Files"
        echo "======================================"

        test -f "$(Build.SourcesDirectory)/k8s/pgadmin-deployment.yml"
        test -f "$(Build.SourcesDirectory)/k8s/pgadmin-service.yaml"

        echo "pgAdmin YAML files found successfully."

      displayName: 'Verify pgAdmin YAML Files'


    # --------------------------------------------------------
    # DEPLOY PGADMIN
    # --------------------------------------------------------

    - task: AzureCLI@2
      displayName: 'Deploy pgAdmin'
      inputs:
        connectionType: 'Azure Resource Manager'
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'

        inlineScript: |

          set -e

          echo "======================================"
          echo "Getting AKS Credentials"
          echo "======================================"

          az aks get-credentials \
            --resource-group "$(resourceGroup)" \
            --name "$(aksCluster)" \
            --overwrite-existing

          echo "======================================"
          echo "Current Kubernetes Context"
          echo "======================================"

          kubectl config current-context

          echo "======================================"
          echo "Checking PostgreSQL"
          echo "======================================"

          kubectl get all -n database

          echo "======================================"
          echo "Deploying pgAdmin"
          echo "======================================"

          kubectl apply \
            -n database \
            -f "$(Build.SourcesDirectory)/k8s/pgadmin-deployment.yml"

          echo "======================================"
          echo "Creating pgAdmin Service"
          echo "======================================"

          kubectl apply \
            -n database \
            -f "$(Build.SourcesDirectory)/k8s/pgadmin-service.yaml"

          echo "======================================"
          echo "pgAdmin Deployment"
          echo "======================================"

          kubectl get deployments -n database

          echo "======================================"
          echo "pgAdmin Pods"
          echo "======================================"

          kubectl get pods -n database -o wide

          echo "======================================"
          echo "pgAdmin Service"
          echo "======================================"

          kubectl get svc -n database

          echo "======================================"
          echo "All Database Resources"
          echo "======================================"

          kubectl get all -n database


# ============================================================
# STAGE 4 - VERIFY
# ============================================================

- stage: Verify
  displayName: 'Verify PostgreSQL and pgAdmin'

  dependsOn: Deploy_pgAdmin

  jobs:
  - job: Verify
    displayName: 'Verify Kubernetes Resources'

    steps:

    # --------------------------------------------------------
    # CHECKOUT REPOSITORY
    # --------------------------------------------------------

    - checkout: self
      displayName: 'Checkout Repository'


    # --------------------------------------------------------
    # VERIFY AKS
    # --------------------------------------------------------

    - task: AzureCLI@2
      displayName: 'Verify Kubernetes Resources'
      inputs:
        connectionType: 'Azure Resource Manager'
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'

        inlineScript: |

          set -e

          echo "======================================"
          echo "Getting AKS Credentials"
          echo "======================================"

          az aks get-credentials \
            --resource-group "$(resourceGroup)" \
            --name "$(aksCluster)" \
            --overwrite-existing

          echo "======================================"
          echo "Current Context"
          echo "======================================"

          kubectl config current-context

          echo "======================================"
          echo "Namespaces"
          echo "======================================"

          kubectl get namespaces

          echo "======================================"
          echo "PostgreSQL / pgAdmin Deployments"
          echo "======================================"

          kubectl get deployments -n database

          echo "======================================"
          echo "Pods"
          echo "======================================"

          kubectl get pods -n database -o wide

          echo "======================================"
          echo "Services"
          echo "======================================"

          kubectl get svc -n database

          echo "======================================"
          echo "PVC"
          echo "======================================"

          kubectl get pvc -n database

          echo "======================================"
          echo "ALL DATABASE RESOURCES"
          echo "======================================"

          kubectl get all -n database

          echo "======================================"
          echo "ALL CLUSTER PODS"
          echo "======================================"

          kubectl get pods -A

          echo "======================================"
          echo "ALL CLUSTER SERVICES"
          echo "======================================"

          kubectl get svc -A