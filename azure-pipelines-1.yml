
name: ingestion

trigger:
  - main

pool:
  name: Default

stages:
  # ============================================================
  # Stage 1: Build and Push Docker Image
  # ============================================================
  - stage: DockerBuild
    displayName: Build and Push Docker Image

    jobs:
      - job: DockerBuildJob
        displayName: Build Ingestion Image

        steps:
          - checkout: self

          - task: Docker@2
            displayName: Build and Push Ingestion Image
            inputs:
              containerRegistry: 'Docker-Registry'
              repository: 'Axion-AI/axion-ingestion'
              command: 'buildAndPush'
              Dockerfile: '$(Build.SourcesDirectory)/axion-ingestion-service/Dockerfile'
              buildContext: '$(Build.SourcesDirectory)/axion-ingestion-service'
              tags: |
                $(Build.BuildId)

  # ============================================================
  # Stage 2: Deploy Image to AKS
  # ============================================================
  - stage: ImageDeploy
    displayName: Deploy Image to AKS
    dependsOn: DockerBuild

    jobs:
      - job: DeployJob
        displayName: Deploy Ingestion Application

        steps:
          - checkout: self

          - task: KubernetesManifest@1
            displayName: Deploy to AKS
            inputs:
              action: 'deploy'
              connectionType: 'kubernetesServiceConnection'
              kubernetesServiceConnection: 'axion-aks'
              namespace: 'default'
              manifests: |
                $(Build.SourcesDirectory)/axion-ingestion-service/k8s/deployment.yaml
              containers: |
                YOUR_REGISTRY_HOST/Axion-AI/axion-ingestion:$(Build.BuildId)
